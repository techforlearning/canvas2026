<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プリンセス着せ替えドリーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Kiwi Maru for cute Japanese font) -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Kiwi Maru', serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #f9bec7 100%);
            min-height: 100vh;
        }
        /* スクロールバーのカスタマイズ */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #ffe5ec;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ff8fab;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #fb6f92;
        }
        /* ふわふわ揺れるアニメーション */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800">

    <!-- ヘッダー -->
    <header class="w-full py-4 px-6 bg-white/80 backdrop-blur-md shadow-sm border-b border-pink-100 flex justify-between items-center z-10">
        <h1 class="text-xl md:text-2xl font-bold text-pink-600 flex items-center gap-2">
            <i class="fa-solid fa-crown text-amber-400 floating"></i>
            <span>プリンセス着せ替えドリーム</span>
        </h1>
        <div class="flex gap-2">
            <button id="btn-random" class="bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-2 px-4 rounded-full shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-xs md:text-sm flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles"></i> おまかせ
            </button>
            <button id="btn-reset" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 px-4 rounded-full shadow-sm transition-all text-xs md:text-sm flex items-center gap-1">
                <i class="fa-solid fa-rotate-left"></i> リセット
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 md:p-6 gap-6 items-stretch">
        
        <!-- 左側：プリンセスプレビュー画面 (キャンバス) -->
        <div class="flex-1 bg-white/40 backdrop-blur-md rounded-3xl p-4 border border-white/60 shadow-xl flex flex-col items-center justify-between min-h-[450px] lg:min-h-0">
            
            <!-- キャラクター表示エリア -->
            <div id="canvas-container" class="relative w-full max-w-[340px] aspect-[3/4] bg-gradient-to-b from-sky-100 to-pink-100 rounded-2xl overflow-hidden shadow-inner border-2 border-white/80 transition-all duration-500">
                
                <!-- 背景レイヤー -->
                <div id="layer-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-500"></div>
                
                <!-- キラキラエフェクトレイヤー -->
                <div class="absolute inset-0 pointer-events-none opacity-40 mix-blend-screen bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-200 via-transparent to-transparent"></div>
                
                <!-- キャラクターレイヤー（最背面から順に重ねる） -->
                <!-- 1. 後ろ髪 -->
                <svg id="layer-hair-back" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 2. 素体 (体と頭) -->
                <svg id="layer-body" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 3. アイメイク / 表情 -->
                <svg id="layer-face" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 4. トップス/ドレス -->
                <svg id="layer-dress" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 5. シューズ -->
                <svg id="layer-shoes" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 6. 前髪 -->
                <svg id="layer-hair-front" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 7. アクセサリー (ネックレス・王冠) -->
                <svg id="layer-accessory" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>
                
                <!-- 8. 手持ちアイテム -->
                <svg id="layer-hand" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 300 400"></svg>

            </div>

            <!-- アクションエリア -->
            <div class="w-full max-w-[340px] mt-4 flex justify-between gap-3">
                <!-- カラーパレット（髪やドレス用） -->
                <div class="flex flex-col gap-1 flex-1">
                    <span class="text-xs text-pink-600 font-bold"><i class="fa-solid fa-palette"></i> テーマカラー</span>
                    <div class="flex gap-2" id="color-palette">
                        <!-- JSでカラーボタンを生成 -->
                    </div>
                </div>
                
                <!-- 保存ボタン -->
                <button id="btn-save" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold px-5 py-2 rounded-full shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center gap-2 text-sm self-end">
                    <i class="fa-solid fa-camera"></i> 保存する
                </button>
            </div>
        </div>

        <!-- 右側：着せ替えアイテムセレクター -->
        <div class="w-full lg:w-[480px] bg-white/90 backdrop-blur-md rounded-3xl p-4 md:p-6 border border-white/80 shadow-xl flex flex-col h-[500px] lg:h-auto">
            
            <!-- カテゴリタブ -->
            <div class="flex gap-2 overflow-x-auto pb-3 mb-4 custom-scrollbar snap-x" id="category-tabs">
                <!-- JSでカテゴリボタンを動的生成 -->
            </div>

            <!-- アイテムリスト -->
            <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar" id="item-grid-container">
                <div class="grid grid-cols-3 sm:grid-cols-4 gap-3" id="item-grid">
                    <!-- JSで選択中のカテゴリに応じたアイテムカードを生成 -->
                </div>
            </div>
            
            <!-- インフォメーション -->
            <div class="mt-4 pt-4 border-t border-pink-100 text-center text-xs text-pink-400">
                お気に入りのコーディネートができたら「保存する」ボタンで写真を撮ろう！
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full py-4 text-center text-xs text-pink-500/80 mt-auto">
        &copy; 2026 プリンセス着せ替えドリーム - Magical Dress-up Game
    </footer>

    <!-- 保存モーダル -->
    <div id="save-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-pink-100 flex flex-col items-center gap-4 animate-[bounce_0.5s_ease-out_1]">
            <h3 class="text-lg font-bold text-pink-600 flex items-center gap-1">
                <i class="fa-solid fa-sparkles text-amber-400"></i> すてきなプリンセス！
            </h3>
            <p class="text-xs text-gray-500 text-center">画像を長押し、または下の保存ボタンから保存してください。</p>
            
            <!-- キャプチャプレビュー用の擬似キャンバス画像表示 -->
            <div id="modal-preview-container" class="relative w-[240px] aspect-[3/4] rounded-xl overflow-hidden border-2 border-pink-200 shadow-md">
                <!-- ここにレンダリングされた画像が入ります -->
                <img id="capture-image" class="w-full h-full object-cover" src="" alt="Princess">
            </div>

            <div class="flex gap-3 w-full">
                <button id="btn-modal-close" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-full transition-all text-sm">
                    とじる
                </button>
                <a id="btn-download" href="#" download="my_princess.png" class="flex-1 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-2.5 rounded-full text-center transition-all text-sm flex items-center justify-center gap-1 shadow-md">
                    <i class="fa-solid fa-download"></i> ダウンロード
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript 処理 -->
    <script>
        // --- 1. グローバル設定 & データ定義 ---
        const colors = [
            { id: 'blue', name: 'アクアブルー', primary: '#70e6ff', shadow: '#4b9fff' },
            { id: 'gold', name: 'ハニーゴールド', primary: '#f6d365', shadow: '#fda085' },
            { id: 'pink', name: 'プリンセスピンク', primary: '#ff9a9e', shadow: '#fecfef' },
            { id: 'brown', name: 'クラシックブラウン', primary: '#845ec2', shadow: '#4b4453' },
            { id: 'silver', name: 'プラチナシルバー', primary: '#e2ebf0', shadow: '#cfd9df' },
            { id: 'purple', name: 'ラベンダー', primary: '#dcd6f7', shadow: '#a6b1e1' }
        ];

        let selectedColor = colors[0]; // 初期値アクアブルー

        // お肌の色データ
        const skins = {
            skin1: { name: 'ミルキーピーチ', primary: '#ffe3d1', stroke: '#f0c2a2' },
            skin2: { name: 'スノーホワイト', primary: '#fff5f0', stroke: '#ebd5cb' },
            skin3: { name: 'ココアベージュ', primary: '#e8be9e', stroke: '#c79c7b' },
            skin4: { name: 'サニーブロンズ', primary: '#f2bd91', stroke: '#db9d6b' }
        };

        // 背景デザイン一覧
        const backgrounds = [
            { id: 'bg1', name: 'お城のバルコニー', style: 'linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%)', pattern: 'balcony' },
            { id: 'bg2', name: '星空の舞踏会', style: 'linear-gradient(to top, #30cfd0 0%, #330867 100%)', pattern: 'stars' },
            { id: 'bg3', name: '森の秘密の庭園', style: 'linear-gradient(to top, #96fbc4 0%, #f9f586 100%)', pattern: 'forest' },
            { id: 'bg4', name: 'マーメイドキャッスル', style: 'linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%)', pattern: 'sea' }
        ];

        // 各カテゴリの着せ替えアイテムデータ
        const items = {
            hair: [
                { id: 'hair1', name: 'ノーブルロング', icon: '💇‍♀️', isColorable: true },
                { id: 'hair2', name: 'ツインテールロール', icon: '🎀', isColorable: true },
                { id: 'hair3', name: 'ロイヤルお団子アップ', icon: '👸', isColorable: true },
                { id: 'hair4', name: 'ゆるふわショートボブ', icon: '👩', isColorable: true }
            ],
            face: [
                { id: 'face1', name: 'キラキラハッピー', icon: '😊' },
                { id: 'face2', name: 'うるうるエンジェル', icon: '😉' },
                { id: 'face3', name: 'おっとりドリーミー', icon: '😍' },
                { id: 'face4', name: 'あこがれクラシック', icon: '✨' }
            ],
            skin: [
                { id: 'skin1', name: 'ミルキーピーチ', icon: '🍑' },
                { id: 'skin2', name: 'スノーホワイト', icon: '❄️' },
                { id: 'skin3', name: 'ココアベージュ', icon: '🍫' },
                { id: 'skin4', name: 'サニーブロンズ', icon: '☀️' }
            ],
            dress: [
                { id: 'dress1', name: 'シンデレラドレス', icon: '👗', color: '#8ec5fc' },
                { id: 'dress2', name: 'ベル・薔薇ドレス', icon: '🌹', color: '#f6d365' },
                { id: 'dress3', name: 'マーメイドドレス', icon: '🧜‍♀️', color: '#a1c4fd' },
                { id: 'dress4', name: 'いちごロリータドレス', icon: '🍓', color: '#ff9a9e' },
                { id: 'dress5', name: 'クイーンパープルドレス', icon: '🍇', color: '#b19ffb' },
                { id: 'dress6', name: 'フェアリーバタフライ', icon: '🦋', color: '#a3f7bf' },
                { id: 'dress7', name: 'スノークリスタル', icon: '❄️', color: '#c9eefc' }
            ],
            accessory: [
                { id: 'none', name: 'なし', icon: '❌' },
                { id: 'acc1', name: 'ティアラ＆ネックレス', icon: '👑' },
                { id: 'acc2', name: 'フラワークラウン', icon: '🌸' },
                { id: 'acc3', name: 'リボンカチューシャ', icon: '🎀' }
            ],
            shoes: [
                { id: 'shoes1', name: 'ガラスの靴', icon: '👠' },
                { id: 'shoes2', name: 'ピンクストラップ', icon: '🩰' },
                { id: 'shoes3', name: 'ゴールドミュール', icon: '👡' }
            ],
            hand: [
                { id: 'none', name: 'なし', icon: '❌' },
                { id: 'hand1', name: '魔法のステッキ', icon: '🪄' },
                { id: 'hand2', name: 'バラの花束', icon: '💐' },
                { id: 'hand3', name: 'ロイヤルファン(扇)', icon: '🪭' }
            ],
            background: [
                { id: 'bg1', name: 'バルコニー', icon: '🏰' },
                { id: 'bg2', name: '星空', icon: '🌌' },
                { id: 'bg3', name: '森の庭園', icon: '🌳' },
                { id: 'bg4', name: '海の宮殿', icon: '🧜' }
            ]
        };

        // 現在のプリンセスのコーディネート状態
        let currentDressUp = {
            hair: 'hair1',
            face: 'face1',
            skin: 'skin1',
            dress: 'dress1',
            accessory: 'acc1',
            shoes: 'shoes1',
            hand: 'none',
            background: 'bg1'
        };

        // カテゴリの日本語表示用
        const categoryLabels = {
            hair: 'かみがた',
            face: 'メイク',
            skin: 'おはだ',
            dress: 'ドレス',
            accessory: 'アクセ',
            shoes: 'くつ',
            hand: 'もちもの',
            background: 'はいけい'
        };

        let currentCategory = 'hair';

        // --- 2. SVGパーツ描画エンジン ---

        // 素体（お肌の色に対応）
        function drawBody() {
            const svg = document.getElementById('layer-body');
            const skin = skins[currentDressUp.skin] || skins.skin1;
            
            svg.innerHTML = `
                <!-- 体・首 -->
                <path d="M135 240 L165 240 L160 215 L140 215 Z" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="2" />
                <path d="M120 238 Q150 242 180 238 L170 310 L130 310 Z" fill="${skin.primary}" />
                <!-- 腕 -->
                <path d="M115 240 Q90 280 110 305 Q120 305 125 285" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="1.5" />
                <path d="M185 240 Q210 280 190 305 Q180 305 175 285" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="1.5" />
                <!-- 顔の輪郭 (少し丸みを出してかわいく) -->
                <path d="M102 180 C102 135 198 135 198 180 C198 220 182 232 150 232 C118 232 102 220 102 180 Z" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="2" />
                <!-- 耳 -->
                <circle cx="100" cy="185" r="8" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="1" />
                <circle cx="200" cy="185" r="8" fill="${skin.primary}" stroke="${skin.stroke}" stroke-width="1" />
            `;
        }

        // お顔メイク（可愛さを最大化したアイ＆チークデザイン）
        function drawFace(faceId) {
            const svg = document.getElementById('layer-face');
            let content = '';

            // ふんわりとしたかわいいピンクチーク
            content += `
                <ellipse cx="120" cy="198" rx="10" ry="5" fill="#ff7da7" opacity="0.5" />
                <ellipse cx="180" cy="198" rx="10" ry="5" fill="#ff7da7" opacity="0.5" />
                <!-- チークの中の照れ線(きらきら感) -->
                <path d="M116 198 L119 195 M121 199 L124 196 M125 201 L128 198" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
                <path d="M176 198 L179 195 M181 199 L184 196 M185 201 L188 198" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
            `;

            // まつげ・二重ラインのベーススタイル
            const eyeColor = '#3a2d24'; // 深いココアブラウン

            if (faceId === 'face1') {
                // キラキラハッピー（うるうるキラキラな瞳＋微笑み）
                content += `
                    <!-- 二重ライン -->
                    <path d="M112 170 Q124 162 136 169" fill="none" stroke="#a38272" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M164 170 Q176 162 188 169" fill="none" stroke="#a38272" stroke-width="1.5" stroke-linecap="round" />
                    
                    <!-- 左目 -->
                    <ellipse cx="124" cy="180" rx="11" ry="12" fill="${eyeColor}" />
                    <circle cx="121" cy="176" r="4.5" fill="#ffffff" /> <!-- メインハイライト -->
                    <circle cx="127" cy="184" r="2.5" fill="#ffffff" /> <!-- サブハイライト -->
                    <circle cx="120" cy="184" r="1" fill="#ffffff" opacity="0.8" /> <!-- うるうる感 -->
                    <!-- まつげ -->
                    <path d="M112 176 Q124 167 136 174" fill="none" stroke="${eyeColor}" stroke-width="3" stroke-linecap="round" />
                    <path d="M134 172 L139 168" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />
                    <path d="M113 174 L108 170" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />

                    <!-- 右目 -->
                    <ellipse cx="176" cy="180" rx="11" ry="12" fill="${eyeColor}" />
                    <circle cx="173" cy="176" r="4.5" fill="#ffffff" />
                    <circle cx="179" cy="184" r="2.5" fill="#ffffff" />
                    <circle cx="172" cy="184" r="1" fill="#ffffff" opacity="0.8" />
                    <!-- まつげ -->
                    <path d="M164 174 Q176 167 188 176" fill="none" stroke="${eyeColor}" stroke-width="3" stroke-linecap="round" />
                    <path d="M166 172 L161 168" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />
                    <path d="M187 174 L192 170" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />

                    <!-- 眉毛 -->
                    <path d="M114 160 Q124 153 134 157" fill="none" stroke="#a38272" stroke-width="2" stroke-linecap="round" />
                    <path d="M166 157 Q176 153 186 160" fill="none" stroke="#a38272" stroke-width="2" stroke-linecap="round" />

                    <!-- お口（ちょっと開けた笑顔） -->
                    <path d="M144 204 Q150 214 156 204" fill="#ff6b8b" stroke="#e04d70" stroke-width="1.5" />
                    <path d="M142 203 Q150 206 158 203" fill="none" stroke="#e04d70" stroke-width="2" stroke-linecap="round" />
                `;
            } else if (faceId === 'face2') {
                // うるうるエンジェル（ハートハイライトの最強ウィンク）
                content += `
                    <!-- 左目 (ウインク) -->
                    <path d="M112 181 Q124 167 136 181" fill="none" stroke="${eyeColor}" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M110 178 L105 174" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />
                    <path d="M138 178 L143 174" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />
                    
                    <!-- 右目 (うるうるハート) -->
                    <ellipse cx="176" cy="180" rx="11" ry="12" fill="${eyeColor}" />
                    <!-- ハート型ハイライト -->
                    <path d="M174 173 C172 171 170 171 169 173 C168 174 168 176 171 178 L174 181 L177 178 C180 176 180 174 179 173 C178 171 176 171 174 173 Z" fill="#ffffff" />
                    <circle cx="179" cy="184" r="2.5" fill="#ffffff" />
                    <!-- まつげ -->
                    <path d="M164 174 Q176 167 188 176" fill="none" stroke="${eyeColor}" stroke-width="3" stroke-linecap="round" />
                    <path d="M187 174 L192 170" stroke="${eyeColor}" stroke-width="2" stroke-linecap="round" />

                    <!-- 眉毛 -->
                    <path d="M114 158 Q124 153 134 160" fill="none" stroke="#a38272" stroke-width="2" stroke-linecap="round" />
                    <path d="M166 156 Q176 151 186 158" fill="none" stroke="#a38272" stroke-width="2" stroke-linecap="round" />

                    <!-- お口（ペロッとした猫口） -->
                    <path d="M145 204 Q150 208 155 204 Q160 208 165 204" fill="none" stroke="#e04d70" stroke-width="2.5" stroke-linecap="round" />
                `;
            } else if (faceId === 'face3') {
                // おっとりドリーミー（お星様ハイライトのハーフアイ）
                content += `
                    <!-- 左目 -->
                    <ellipse cx="124" cy="182" rx="11" ry="10" fill="#4d3b5a" />
                    <!-- 星ハイライト -->
                    <polygon points="124,175 125,178 128,178 126,180 127,183 124,181 121,183 122,180 120,178 123,178" fill="#ffffff" />
                    <circle cx="128" cy="185" r="2" fill="#ffffff" />
                    <!-- まつげ＆まぶた -->
                    <path d="M112 176 Q124 169 136 176" fill="none" stroke="#4d3b5a" stroke-width="3.5" stroke-linecap="round" />
                    <path d="M112 172 Q124 165 136 172" fill="none" stroke="#ffb3c1" stroke-width="1.5" />

                    <!-- 右目 -->
                    <ellipse cx="176" cy="182" rx="11" ry="10" fill="#4d3b5a" />
                    <!-- 星ハイライト -->
                    <polygon points="176,175 177,178 180,178 178,180 179,183 176,181 173,183 174,180 172,178 175,178" fill="#ffffff" />
                    <circle cx="180" cy="185" r="2" fill="#ffffff" />
                    <!-- まつげ＆まぶた -->
                    <path d="M164 176 Q176 169 188 176" fill="none" stroke="#4d3b5a" stroke-width="3.5" stroke-linecap="round" />

            } else if (accId === 'acc3') {
                // 大きなピンクリボン
                content = `
                    <g transform="translate(150, 134)">
                        <rect x="-6" y="-14" width="12" height="10" rx="3" fill="#ff4d6d" />
                        <path d="M-6 -10 C-30 -25 -35 5 -6 -6 Z" fill="#ff758f" stroke="#ff4d6d" stroke-width="1.5" />
                        <path d="M6 -10 C30 -25 35 5 6 -6 Z" fill="#ff758f" stroke="#ff4d6d" stroke-width="1.5" />
                        <path d="M-4 -6 L-15 12 L-8 12 Z" fill="#ff4d6d" />
                        <path d="M4 -6 L15 12 L8 12 Z" fill="#ff4d6d" />
                    </g>
                `;
            }

            svg.innerHTML = content;
        }

        // 持ち物・アイテム
        function drawHand(handId) {
            const svg = document.getElementById('layer-hand');
            let content = '';

            if (handId === 'hand1') {
                // 魔法のステッキ (右手に持たせる)
                content = `
                    <path d="M190 280 L235 220" stroke="#f6d365" stroke-width="3" stroke-linecap="round" />
                    <g transform="translate(235, 220)">
                        <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,6 -8,11 -5,2 -12,-3 -3,-3" fill="#ffd700" stroke="#ffa000" stroke-width="1" />
                        <circle cx="0" cy="0" r="3" fill="#ffffff" />
                        <circle cx="-10" cy="-12" r="1.5" fill="#fff" />
                        <circle cx="12" cy="10" r="1.5" fill="#fff" />
                        <circle cx="-12" cy="8" r="2" fill="#ffe5ec" />
                    </g>
                `;
            } else if (handId === 'hand2') {
                // バラの花束
                content = `
                    <g transform="translate(182, 275)">
                        <path d="M0 0 L-20 -35 Q0 -45 20 -35 Z" fill="#ffe5ec" stroke="#ffb3c1" stroke-width="1" />
                        <path d="M0 0 L-10 -35 L10 -35 Z" fill="#fff" opacity="0.6" />
                        <circle cx="-8" cy="-35" r="9" fill="#ff3366" />
                        <circle cx="8" cy="-35" r="9" fill="#ff4d6d" />
                        <circle cx="0" cy="-42" r="9" fill="#c9184a" />
                        <path d="M-8 -35 Q-11 -38 -8 -41 Q-5 -38 -8 -35" fill="none" stroke="#fff" stroke-width="1" />
                        <path d="M8 -35 Q5 -38 8 -41 Q11 -38 8 -35" fill="none" stroke="#fff" stroke-width="1" />
                        <path d="M0 -42 Q-3 -45 0 -48 Q3 -45 0 -42" fill="none" stroke="#fff" stroke-width="1" />
                        <path d="M-5 -2 Q0 8 5 -2 Q8 -6 0 -6 Q-8 -6 -5 -2" fill="#ffb3c1" />
                    </g>
                `;
            } else if (handId === 'hand3') {
                // ロイヤル扇子
                content = `
                    <g transform="translate(184, 272)">
                        <path d="M0 10 L-22 -15 M0 10 L-12 -22 M0 10 L0 -25 M0 10 L12 -22 M0 10 L22 -15" stroke="#ffd700" stroke-width="2" />
                        <path d="M-22 -15 A 25 25 0 0 1 22 -15 L12 -5 A 12 12 0 0 0 -12 -5 Z" fill="#e0f7fa" stroke="#ffd700" stroke-width="1" />
                        <path d="M-22 -15 Q-15 -25 0 -25 Q15 -25 22 -15" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3,2" />
                        <circle cx="0" cy="-15" r="3" fill="#ff4d6d" />
                    </g>
                `;
            }

            svg.innerHTML = content;
        }

        // 背景切り替え
        function drawBackground(bgId) {
            const container = document.getElementById('canvas-container');
            const bgObj = backgrounds.find(b => b.id === bgId);
            if (bgObj) {
                container.style.background = bgObj.style;
            }
        }

        // --- 3. ユーティリティ & カラー変更関数 ---
        function adjustColorBrightness(hex, percent) {
            let R = parseInt(hex.substring(1, 3), 16);
            let G = parseInt(hex.substring(3, 5), 16);
            let B = parseInt(hex.substring(5, 7), 16);

            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);

            R = (R < 255) ? R : 255;
            G = (G < 255) ? G : 255;
            B = (B < 255) ? B : 255;

            R = (R > 0) ? R : 0;
            G = (G > 0) ? G : 0;
            B = (B > 0) ? B : 0;

            const rHex = ((R.toString(16).length === 1) ? "0" + R.toString(16) : R.toString(16));
            const gHex = ((G.toString(16).length === 1) ? "0" + G.toString(16) : G.toString(16));
            const bHex = ((B.toString(16).length === 1) ? "0" + B.toString(16) : B.toString(16));

            return "#" + rHex + gHex + bHex;
        }

        // 全レイヤーを再描画するマスター関数
        function renderPrincess() {
            drawBody();
            drawFace(currentDressUp.face);
            drawHair(currentDressUp.hair, selectedColor);
            
            // ドレスの色は選択中のカラーに応じて変化（ドレス1, ドレス6, ドレス7に対応）
            let dressColor = null;
            if (currentDressUp.dress === 'dress1' || currentDressUp.dress === 'dress6' || currentDressUp.dress === 'dress7') {
                dressColor = selectedColor.primary;
            } else {
                const defaultDress = items.dress.find(d => d.id === currentDressUp.dress);
                dressColor = defaultDress ? defaultDress.color : '#ffccd5';
            }
            drawDress(currentDressUp.dress, dressColor);
            
            drawShoes(currentDressUp.shoes);
            drawAccessory(currentDressUp.accessory);
            drawHand(currentDressUp.hand);
            drawBackground(currentDressUp.background);
        }

        // --- 4. UI 構築 & イベント処理 ---
        
        // カテゴリタブの生成
        function initCategoryTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';

            Object.keys(items).forEach(catKey => {
                const isActive = catKey === currentCategory;
                const tab = document.createElement('button');
                tab.className = `snap-align-start flex-none px-4 py-2 rounded-full font-bold text-sm transition-all whitespace-nowrap ${
                    isActive 
                    ? 'bg-pink-500 text-white shadow-md' 
                    : 'bg-pink-50 text-pink-600 hover:bg-pink-100'
                }`;
                tab.textContent = categoryLabels[catKey];
                tab.addEventListener('click', () => {
                    currentCategory = catKey;
                    initCategoryTabs(); // アクティブ状態を再描画
                    renderItemGrid();   // アイテム選択肢を再描画
                });
                tabsContainer.appendChild(tab);
            });
        }

        // アイテムグリッドの生成
        function renderItemGrid() {
            const grid = document.getElementById('item-grid');
            grid.innerHTML = '';

            const currentItems = items[currentCategory];
            currentItems.forEach(item => {
                const isSelected = currentDressUp[currentCategory] === item.id;
                const card = document.createElement('button');
                
                card.className = `relative aspect-square flex flex-col items-center justify-center p-2 rounded-2xl border-2 transition-all cursor-pointer ${
                    isSelected 
                    ? 'border-pink-500 bg-pink-50/50 shadow-inner scale-95' 
                    : 'border-transparent bg-white hover:border-pink-200 hover:bg-pink-50/20'
                } shadow-sm`;

                card.innerHTML = `
                    <div class="text-3xl mb-1">${item.icon}</div>
                    <div class="text-[10px] text-gray-500 text-center font-bold leading-tight line-clamp-2">${item.name}</div>
                `;

                if (isSelected) {
                    const check = document.createElement('div');
                    check.className = 'absolute top-1 right-1 bg-pink-500 text-white w-4 h-4 rounded-full flex items-center justify-center text-[8px]';
                    check.innerHTML = '<i class="fa-solid fa-check"></i>';
                    card.appendChild(check);
                }

                card.addEventListener('click', () => {
                    currentDressUp[currentCategory] = item.id;
                    renderItemGrid();
                    renderPrincess();
                });

                grid.appendChild(card);
            });
        }

        // カラーパレットの生成
        function initColorPalette() {
            const palette = document.getElementById('color-palette');
            palette.innerHTML = '';

            colors.forEach(col => {
                const isSelected = col.id === selectedColor.id;
                const btn = document.createElement('button');
                btn.className = `w-8 h-8 rounded-full border-2 transition-all ${
                    isSelected ? 'border-pink-600 scale-110 shadow-md' : 'border-white hover:scale-105'
                }`;
                btn.style.backgroundColor = col.primary;
                btn.title = col.name;

                btn.addEventListener('click', () => {
                    selectedColor = col;
                    initColorPalette();
                    renderPrincess();
                });

                palette.appendChild(btn);
            });
        }

        // --- 5. 特別なボタンアクション ---

        // おまかせ（ランダムコーディネート）
        document.getElementById('btn-random').addEventListener('click', () => {
            Object.keys(items).forEach(catKey => {
                const catItems = items[catKey];
                const randomItem = catItems[Math.floor(Math.random() * catItems.length)];
                currentDressUp[catKey] = randomItem.id;
            });

            // 髪色のランダム化
            selectedColor = colors[Math.floor(Math.random() * colors.length)];

            initColorPalette();
            renderItemGrid();
            renderPrincess();
        });

        // リセット
        document.getElementById('btn-reset').addEventListener('click', () => {
            currentDressUp = {
                hair: 'hair1',
                face: 'face1',
                skin: 'skin1',
                dress: 'dress1',
                accessory: 'acc1',
                shoes: 'shoes1',
                hand: 'none',
                background: 'bg1'
            };
            selectedColor = colors[0]; // 初期カラー（ブルー）にリセット

            initColorPalette();
            renderItemGrid();
            renderPrincess();
        });

        // --- 6. 画像として保存（SVGをCanvasへレンダリングして保存） ---
        document.getElementById('btn-save').addEventListener('click', () => {
            const container = document.getElementById('canvas-container');
            const bgObj = backgrounds.find(b => b.id === currentDressUp.background);
            
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 800; 
            const ctx = canvas.getContext('2d');

            // 1. 背景の描画
            const gradient = ctx.createLinearGradient(0, 800, 0, 0);
            if (bgObj) {
                if (bgObj.id === 'bg1') {
                    gradient.addColorStop(0, '#fad0c4');
                    gradient.addColorStop(1, '#ffd1ff');
                } else if (bgObj.id === 'bg2') {
                    gradient.addColorStop(0, '#30cfd0');
                    gradient.addColorStop(1, '#330867');
                } else if (bgObj.id === 'bg3') {
                    gradient.addColorStop(0, '#96fbc4');
                    gradient.addColorStop(1, '#f9f586');
                } else if (bgObj.id === 'bg4') {
                    gradient.addColorStop(0, '#e0c3fc');
                    gradient.addColorStop(1, '#8ec5fc');
                }
            } else {
                gradient.addColorStop(0, '#ffe5ec');
                gradient.addColorStop(1, '#ffd1ff');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 各SVGレイヤーをCanvasに描画
            const layers = [
                'layer-hair-back',
                'layer-body',
                'layer-face',
                'layer-dress',
                'layer-shoes',
                'layer-hair-front',
                'layer-accessory',
                'layer-hand'
            ];

            let loadedCount = 0;
            const imagesToLoad = [];

            layers.forEach((layerId, index) => {
                const svgEl = document.getElementById(layerId);
                if (!svgEl) return;

                if (svgEl.innerHTML.trim() === "") {
                    loadedCount++;
                    checkAllLoaded();
                    return;
                }

                const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="600" height="800">${svgEl.innerHTML}</svg>`;
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const img = new Image();
                img.src = url;
                imagesToLoad.push({ img, index });

                img.onload = () => {
                    loadedCount++;
                    URL.revokeObjectURL(url);
                    checkAllLoaded();
                };
                img.onerror = () => {
                    loadedCount++;
                    checkAllLoaded();
                };
            });

            function checkAllLoaded() {
                if (loadedCount === layers.length) {
                    imagesToLoad.sort((a, b) => a.index - b.index);
                    imagesToLoad.forEach(item => {
                        ctx.drawImage(item.img, 0, 0, canvas.width, canvas.height);
                    });

                    // ロゴスタンプ風
                    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                    ctx.beginPath();
                    ctx.roundRect(400, 740, 180, 40, 10);
                    ctx.fill();

                    ctx.font = "bold 14px 'Kiwi Maru', sans-serif";
                    ctx.fillStyle = "#db2777";
                    ctx.textAlign = "center";
                    ctx.fillText("プリンセスドリーム", 490, 765);

                    try {
                        const dataUrl = canvas.toDataURL('image/png');
                        const imgElem = document.getElementById('capture-image');
                        imgElem.src = dataUrl;

                        const downloadBtn = document.getElementById('btn-download');
                        downloadBtn.href = dataUrl;

                        document.getElementById('save-modal').classList.remove('hidden');
                    } catch (e) {
                        console.error("書き出しエラー", e);
                    }
                }
            }
        });

        // モーダル
        document.getElementById('btn-modal-close').addEventListener('click', () => {
            document.getElementById('save-modal').classList.add('hidden');
        });

        document.getElementById('save-modal').addEventListener('click', (e) => {
            if (e.target.id === 'save-modal') {
                document.getElementById('save-modal').classList.add('hidden');
            }
        });

        // --- 7. 初期実行 ---
        window.onload = () => {
            initCategoryTabs();
            renderItemGrid();
            initColorPalette();
            renderPrincess();
        };

    </script>
