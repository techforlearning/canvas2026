<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四目・五目・六目並べ - 自由配置スタイル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 盤面のグラデーションとシャドウ効果 */
        .board-container {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        /* マス目の効果：少し凹んだような半透明の穴を表現 */
        .board-cell {
            background-color: rgba(15, 23, 42, 0.65); /* 凹みを表現する半透明の暗闇 */
            border: 2px solid rgba(15, 23, 42, 0.8);
            border-radius: 9999px; /* 丸い穴にする */
            box-shadow: inset 0 4px 6px -1px rgba(0, 0, 0, 0.6);
            transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* エフェクトがはみ出せるように */
        }
        /* ホバー時の効果（空きマスのみ有効に） */
        .board-cell.clickable:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.03);
            cursor: pointer;
        }
        /* コマの出現（ポップイン）アニメーション */
        @keyframes popInToken {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.12);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .token-animation {
            animation: popInToken 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- ヘッダー -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-500 flex items-center gap-3">
                <i class="fa-solid fa-circle-play text-red-500"></i> マルチ並べ (8x9)
            </h1>
            
            <div class="flex flex-wrap items-center gap-4">
                <!-- モード選択 -->
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-400">モード:</span>
                    <select id="mode-select" class="bg-slate-700 text-white border border-slate-600 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm cursor-pointer transition-colors hover:bg-slate-600">
                        <option value="ai" selected>AIと対戦</option>
                        <option value="pvp">友達と対戦 (2P)</option>
                    </select>
                </div>

                <!-- 並べる数（勝利条件）選択 -->
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-400">並べる数:</span>
                    <select id="win-condition-select" class="bg-slate-700 text-white border border-slate-600 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm cursor-pointer transition-colors hover:bg-slate-600">
                        <option value="4" selected>4つ並べる (四目)</option>
                        <option value="5">5つ並べる (五目)</option>
                        <option value="6">6つ並べる (六目)</option>
                    </select>
                </div>

                <!-- 難易度選択（AIモードの時だけ有効） -->
                <div id="difficulty-area" class="flex items-center gap-2">
                    <span class="text-sm text-slate-400">AI難易度:</span>
                    <select id="difficulty-select" class="bg-slate-700 text-white border border-slate-600 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm cursor-pointer transition-colors hover:bg-slate-600">
                        <option value="easy">初級 (Easy)</option>
                        <option value="medium" selected>中級 (Medium)</option>
                        <option value="hard">上級 (Hard)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">
        
        <!-- 説明テキスト -->
        <p class="text-slate-400 text-xs md:text-sm mb-4 text-center">
            <i class="fa-solid fa-circle-info text-sky-400"></i> 空いているマスを直接選んでタップ！縦・横・斜めに指定された数だけ並べると勝ちです。
        </p>

        <!-- ステータスボード -->
        <div class="w-full max-w-lg mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <!-- プレイヤー1 (赤) -->
            <div id="player-card" class="flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border-2 border-red-500 bg-red-950/30">
                <div class="w-8 h-8 rounded-full bg-red-500 shadow-md shadow-red-500/50"></div>
                <div>
                    <p id="player-label" class="font-bold text-sm">あなた (赤)</p>
                    <p id="player-score" class="text-xs text-slate-400">勝利数: 0</p>
                </div>
            </div>

            <!-- VS表示 / ターン表示 -->
            <div class="text-center">
                <div id="turn-indicator" class="text-yellow-400 font-bold text-lg px-3 py-1 rounded bg-slate-900 border border-slate-700 animate-pulse">
                    あなたの番
                </div>
            </div>

            <!-- プレイヤー2 / AI (黄) -->
            <div id="ai-card" class="flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border border-transparent">
                <div class="w-8 h-8 rounded-full bg-yellow-400 shadow-md shadow-yellow-400/50"></div>
                <div class="text-right">
                    <p id="ai-label" class="font-bold text-sm">AI (黄)</p>
                    <p id="ai-score" class="text-xs text-slate-400">勝利数: 0</p>
                </div>
            </div>
        </div>

        <!-- 盤面 (8行9列) -->
        <div class="w-full max-w-lg aspect-[9/8] board-container rounded-2xl p-4 relative" id="board-outer">
            <!-- 盤面グリッド：JSでインラインスタイルを用いて動的に行数と列数を適用します -->
            <div class="grid w-full h-full relative z-10" id="board-grid">
                <!-- JSでセルを生成します -->
            </div>
        </div>

        <!-- 操作エリア -->
        <div class="mt-6 flex gap-4 w-full max-w-lg justify-center">
            <button id="reset-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold py-3 px-6 rounded-xl border border-slate-600 transition-all shadow-md flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> 盤面リセット
            </button>
            <button id="reset-scores-btn" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-400 hover:text-white font-semibold py-3 px-4 rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-2" title="スコアをリセット">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

    </main>

    <!-- モーダル: ゲーム結果 -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 px-4">
        <div class="bg-slate-800 border-2 border-slate-700 p-8 rounded-2xl text-center max-w-sm w-full shadow-2xl transform scale-90 transition-transform duration-300" id="modal-content">
            <div id="result-icon-container" class="text-6xl mb-4">
                <!-- アイコンがJSで入る -->
            </div>
            <h2 id="result-title" class="text-3xl font-extrabold mb-2">勝利！</h2>
            <p id="result-message" class="text-slate-300 mb-6">素晴らしい先読みでした！</p>
            <button id="modal-close-btn" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold py-3 px-6 rounded-xl shadow-lg shadow-yellow-500/20 active:scale-95 transition-all">
                もう一度遊ぶ
            </button>
        </div>
    </div>

    <!-- フッター -->
    <footer class="bg-slate-950 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        <p>© 2026 Connect Four, Five & Six AI & 2P. Touch any empty cell to place.</p>
    </footer>

    <!-- ゲームロジック用スクリプト -->
    <script>
        // 定数 (ここを変更するだけで自動的にマスの数が調整されます)
        const ROWS = 8; // 行数 (縦マス)
        const COLS = 9; // 列数 (横マス)
        const PLAYER = 1; // 赤 (先攻 / プレイヤー1)
        const AI = 2;     // 黄 (後攻 / コンピュータ または プレイヤー2)
        const EMPTY = 0;

        // ゲーム状態
        let board = Array(ROWS).fill(null).map(() => Array(COLS).fill(EMPTY));
        let currentPlayer = PLAYER;
        let isGameOver = false;
        let isAiThinking = false;
        let gameMode = 'ai'; // 'ai' または 'pvp'
        let winCondition = 4; // デフォルトは4つ並べる
        
        let scores = {
            player: 0,
            ai: 0 
        };

        // DOM参照
        const boardGrid = document.getElementById('board-grid');
        const modeSelect = document.getElementById('mode-select');
        const winConditionSelect = document.getElementById('win-condition-select');
        const difficultySelect = document.getElementById('difficulty-select');
        const difficultyArea = document.getElementById('difficulty-area');
        const turnIndicator = document.getElementById('turn-indicator');
        const playerCard = document.getElementById('player-card');
        const aiCard = document.getElementById('ai-card');
        const playerLabel = document.getElementById('player-label');
        const aiLabel = document.getElementById('ai-label');
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const resetBtn = document.getElementById('reset-btn');
        const resetScoresBtn = document.getElementById('reset-scores-btn');
        const resultModal = document.getElementById('result-modal');
        const modalContent = document.getElementById('modal-content');
        const resultIconContainer = document.getElementById('result-icon-container');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // 初期化処理
        function init() {
            createBoardUI();
            resetGame();
            
            // イベントリスナー登録
            resetBtn.addEventListener('click', resetGame);
            resetScoresBtn.addEventListener('click', resetScores);
            modalCloseBtn.addEventListener('click', closeModal);
            
            // モード切り替えイベント
            modeSelect.addEventListener('change', (e) => {
                gameMode = e.target.value;
                if (gameMode === 'pvp') {
                    difficultyArea.classList.add('hidden');
                    playerLabel.textContent = "プレイヤー1 (赤)";
                    aiLabel.textContent = "プレイヤー2 (黄)";
                } else {
                    difficultyArea.classList.remove('hidden');
                    playerLabel.textContent = "あなた (赤)";
                    aiLabel.textContent = "AI (黄)";
                }
                resetScores();
                resetGame();
            });

            // 勝利条件（並べる数）の変更イベント
            winConditionSelect.addEventListener('change', (e) => {
                winCondition = parseInt(e.target.value);
                resetScores();
                resetGame();
            });
        }

        // 盤面UI生成 (グリッド設定をJSから動的に適用)
        function createBoardUI() {
            boardGrid.innerHTML = '';
            
            // 行と列のスタイルを動的に流し込みます
            boardGrid.style.gridTemplateColumns = `repeat(${COLS}, minmax(0, 1fr))`;
            boardGrid.style.gridTemplateRows = `repeat(${ROWS}, minmax(0, 1fr))`;
            boardGrid.style.gap = '0.5rem';

            // 各マス（直接クリック可能なセルとして作成）
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'board-cell w-full h-full clickable';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.id = `cell-${r}-${c}`;
                    
                    // クリックイベント
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardGrid.appendChild(cell);
                }
            }
        }

        // ゲーム状態のリセット
        function resetGame() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(EMPTY));
            isGameOver = false;
            isAiThinking = false;
            currentPlayer = PLAYER; // 常に赤が先攻
            
            // 各セルの状態、中身、見た目を完全に初期化
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.innerHTML = ''; // 中のコマを完全に消去
                        cell.classList.add('clickable');
                        cell.style.backgroundColor = ''; // デフォルトCSSに戻す
                        cell.style.borderColor = '';
                    }
                }
            }
            
            // UI更新
            updateTurnIndicator();
        }

        // スコアのリセット
        function resetScores() {
            scores.player = 0;
            scores.ai = 0;
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            playerScoreEl.textContent = `勝利数: ${scores.player}`;
            aiScoreEl.textContent = `勝利数: ${scores.ai}`;
        }

        // ターン表示更新
        function updateTurnIndicator() {
            if (isGameOver) return;

            if (currentPlayer === PLAYER) {
                if (gameMode === 'pvp') {
                    turnIndicator.textContent = 'プレイヤー1 の番';
                } else {
                    turnIndicator.textContent = 'あなたの番';
                }
                turnIndicator.className = 'text-red-400 font-bold text-lg px-3 py-1 rounded bg-slate-900 border border-red-500 animate-pulse';
                playerCard.className = 'flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border-2 border-red-500 bg-red-950/30 scale-105';
                aiCard.className = 'flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border border-transparent opacity-60';
            } else {
                if (gameMode === 'pvp') {
                    turnIndicator.textContent = 'プレイヤー2 の番';
                } else {
                    turnIndicator.textContent = 'AI 思考中...';
                }
                turnIndicator.className = 'text-yellow-400 font-bold text-lg px-3 py-1 rounded bg-slate-900 border border-yellow-500 animate-pulse';
                aiCard.className = 'flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border-2 border-yellow-400 bg-yellow-950/30 scale-105';
                playerCard.className = 'flex items-center gap-3 p-2 rounded-lg transition-all duration-300 border border-transparent opacity-60';
            }
        }

        // セルクリック時の処理
        function handleCellClick(row, col) {
            if (isGameOver || isAiThinking) return;
            
            // AIのターン中にプレイヤーがクリックするのを防ぐ
            if (gameMode === 'ai' && currentPlayer !== PLAYER) return;

            // すでに置かれているマスはクリック不可
            if (board[row][col] !== EMPTY) return;

            placeToken(row, col, currentPlayer);
        }

        // 指定の座標にコマを配置する
        function placeToken(row, col, player) {
            board[row][col] = player;
            
            const cell = document.getElementById(`cell-${row}-${col}`);
            if (cell) {
                cell.classList.remove('clickable');
                // マスの穴自体のフチの色を少し変えてフィット感を高める
                cell.style.backgroundColor = 'rgba(15, 23, 42, 0.2)';
                cell.style.borderColor = player === PLAYER ? 'rgba(239, 68, 68, 0.4)' : 'rgba(250, 204, 21, 0.4)';

                // コマ要素を作成
                const token = document.createElement('div');
                const colorClass = player === PLAYER 
                    ? 'bg-gradient-to-tr from-red-600 to-red-400 shadow-red-500/50' 
                    : 'bg-gradient-to-tr from-yellow-500 to-yellow-300 shadow-yellow-400/50';
                
                // セルの内側に完璧にハマるように w-[86%] h-[86%] で作成、Flexboxで絶対中央になります
                token.className = `w-[86%] h-[86%] rounded-full ${colorClass} shadow-lg token-animation game-token absolute pointer-events-none`;
                
                cell.appendChild(token);
            }

            // アニメーション完了を待ってから勝敗確認と手番交代
            setTimeout(() => {
                const winningCells = checkWin(board, player);
                if (winningCells) {
                    highlightWinningCells(winningCells);
                    endGame(player);
                } else if (isBoardFull()) {
                    endGame(null); // 引き分け
                } else {
                    // 手番交代
                    currentPlayer = (player === PLAYER) ? AI : PLAYER;
                    updateTurnIndicator();

                    if (gameMode === 'ai' && currentPlayer === AI) {
                        isAiThinking = true;
                        // AIの手番を開始
                        setTimeout(makeAiMove, 500); 
                    }
                }
            }, 300); // ポップインの300msに調整
        }

        // 盤面が満杯かチェック
        function isBoardFull() {
            return board.every(row => row.every(cell => cell !== EMPTY));
        }

        // 勝利条件のチェック（並べる数に合わせた多目的チェック）
        function checkWin(tempBoard, player) {
            const winCount = winCondition; // 4 or 5 or 6

            // 横チェック
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let win = true;
                    let cells = [];
                    for (let i = 0; i < winCount; i++) {
                        if (tempBoard[r][c+i] !== player) {
                            win = false;
                            break;
                        }
                        cells.push([r, c+i]);
                    }
                    if (win) return cells;
                }
            }

            // 縦チェック
            for (let r = 0; r <= ROWS - winCount; r++) {
                for (let c = 0; c < COLS; c++) {
                    let win = true;
                    let cells = [];
                    for (let i = 0; i < winCount; i++) {
                        if (tempBoard[r+i][c] !== player) {
                            win = false;
                            break;
                        }
                        cells.push([r+i, c]);
                    }
                    if (win) return cells;
                }
            }

            // 右下斜めチェック
            for (let r = 0; r <= ROWS - winCount; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let win = true;
                    let cells = [];
                    for (let i = 0; i < winCount; i++) {
                        if (tempBoard[r+i][c+i] !== player) {
                            win = false;
                            break;
                        }
                        cells.push([r+i, c+i]);
                    }
                    if (win) return cells;
                }
            }

            // 左下斜めチェック
            for (let r = winCount - 1; r < ROWS; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let win = true;
                    let cells = [];
                    for (let i = 0; i < winCount; i++) {
                        if (tempBoard[r-i][c+i] !== player) {
                            win = false;
                            break;
                        }
                        cells.push([r-i, c+i]);
                    }
                    if (win) return cells;
                }
            }

            return null;
        }

        // 勝利時のコマに光るアニメーションを追加
        function highlightWinningCells(cells) {
            cells.forEach(([r, c]) => {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if (cell) {
                    const token = cell.querySelector('.game-token');
                    if (token) {
                        // コマの裏で光が広がるリッチなアニメーション（クローンを作成して適用）
                        const ping = token.cloneNode(true);
                        ping.classList.remove('token-animation');
                        ping.classList.add('animate-ping', 'opacity-75');
                        cell.appendChild(ping);

                        token.style.filter = 'brightness(1.35) drop-shadow(0 0 14px currentColor)';
                    }
                }
            });
        }

        // ゲーム終了
        function endGame(winner) {
            isGameOver = true;
            isAiThinking = false;

            // すべてのマスのホバー演出を解除
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) cell.classList.remove('clickable');
                }
            }

            if (winner === PLAYER) {
                scores.player++;
                showModal('player1');
            } else if (winner === AI) {
                scores.ai++;
                showModal(gameMode === 'pvp' ? 'player2' : 'lose');
            } else {
                showModal('draw');
            }

            updateScoreDisplay();
            
            turnIndicator.textContent = 'ゲーム終了';
            turnIndicator.className = 'text-slate-400 font-bold text-lg px-3 py-1 rounded bg-slate-900 border border-slate-700';
            playerCard.className = 'flex items-center gap-3 p-2 rounded-lg border border-transparent opacity-70';
            aiCard.className = 'flex items-center gap-3 p-2 rounded-lg border border-transparent opacity-70';
        }

        // モーダルの表示
        function showModal(type) {
            let winText = `${winCondition}つ`;
            if (type === 'player1') {
                resultIconContainer.innerHTML = '<i class="fa-solid fa-trophy text-red-500 animate-bounce"></i>';
                resultTitle.textContent = gameMode === 'pvp' ? 'プレイヤー1 の勝利！' : 'あなた の 勝利！';
                resultTitle.className = 'text-3xl font-extrabold mb-2 text-red-400';
                resultMessage.textContent = gameMode === 'pvp' 
                    ? `赤色のプレイヤー1が見事${winText}並べて勝利しました！` 
                    : `見事な戦略でした。完璧に${winText}並べて先読みしましたね！`;
            } else if (type === 'player2') {
                resultIconContainer.innerHTML = '<i class="fa-solid fa-trophy text-yellow-400 animate-bounce"></i>';
                resultTitle.textContent = 'プレイヤー2 の勝利！';
                resultTitle.className = 'text-3xl font-extrabold mb-2 text-yellow-400';
                resultMessage.textContent = `黄色のプレイヤー2が見事${winText}並べて勝利しました！`;
            } else if (type === 'lose') {
                resultIconContainer.innerHTML = '<i class="fa-solid fa-robot text-slate-400"></i>';
                resultTitle.textContent = 'AI の 勝利';
                resultTitle.className = 'text-3xl font-extrabold mb-2 text-slate-400';
                resultMessage.textContent = `AIに先に${winText}並べられてしまいました。次の対戦でリベンジしましょう！`;
            } else {
                resultIconContainer.innerHTML = '<i class="fa-solid fa-handshake text-blue-400"></i>';
                resultTitle.textContent = '引き分け';
                resultTitle.className = 'text-3xl font-extrabold mb-2 text-blue-400';
                resultMessage.textContent = '盤面がすべて埋まりました。白熱した良い勝負でした！';
            }

            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        // モーダルを閉じる
        function closeModal() {
            resultModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
            resetGame();
        }


        /* ==========================================================================
           AI (思考ロジック - 多目的並びルール適応版)
           ========================================================================== */

        function makeAiMove() {
            if (isGameOver) return;

            const difficulty = difficultySelect.value;
            let targetMove = null;

            if (difficulty === 'easy') {
                targetMove = getEasyMove();
            } else if (difficulty === 'medium') {
                targetMove = getMediumMove();
            } else {
                targetMove = getHardMove();
            }

            // 何らかの理由で取得できなかった場合のランダムフォールバック
            if (!targetMove) {
                const validMoves = getValidMoves(board);
                targetMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            }

            isAiThinking = false;
            placeToken(targetMove.r, targetMove.c, AI);
        }

        // 盤面全体から空いている全セル座標を返す
        function getValidMoves(tempBoard) {
            const moves = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (tempBoard[r][c] === EMPTY) {
                        moves.push({ r, c });
                    }
                }
            }
            return moves;
        }

        // EASY AI: 基本的にランダムだが、1手で即勝てるところだけ最優先。たまに防ぐ。
        function getEasyMove() {
            const validMoves = getValidMoves(board);

            // 1. 自分が1手で勝てるマスがあるかチェック
            for (let move of validMoves) {
                board[move.r][move.c] = AI;
                const isWin = checkWin(board, AI);
                board[move.r][move.c] = EMPTY;
                if (isWin) return move;
            }

            // 2. 相手が次の一手で勝つ場所があれば、確率で防ぐ
            for (let move of validMoves) {
                board[move.r][move.c] = PLAYER;
                const isEnemyWin = checkWin(board, PLAYER);
                board[move.r][move.c] = EMPTY;
                if (isEnemyWin && Math.random() > 0.3) {
                    return move; // 70%の確率でブロックする
                }
            }

            // 完全ランダム
            return validMoves[Math.floor(Math.random() * validMoves.length)];
        }

        // MEDIUM AI: 即勝利・即防御。さらに一番チャンスになりやすい優秀なマスをスコア評価
        function getMediumMove() {
            const validMoves = getValidMoves(board);

            // 1. 即勝利できるマスがあるか
            for (let move of validMoves) {
                board[move.r][move.c] = AI;
                const isWin = checkWin(board, AI);
                board[move.r][move.c] = EMPTY;
                if (isWin) return move;
            }

            // 2. 相手が即勝利できるマスを100%阻止
            for (let move of validMoves) {
                board[move.r][move.c] = PLAYER;
                const isEnemyWin = checkWin(board, PLAYER);
                board[move.r][move.c] = EMPTY;
                if (isEnemyWin) return move;
            }

            // 3. スコアリングにより一番優秀なマスを選ぶ
            let bestScore = -Infinity;
            let bestMoves = [];

            for (let move of validMoves) {
                board[move.r][move.c] = AI;
                let score = evaluatePosition(board, AI);
                board[move.r][move.c] = EMPTY;

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [move];
                } else if (score === bestScore) {
                    bestMoves.push(move);
                }
            }

            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        // HARD AI: ミニマックス法で先読み (深さ: 2)
        function getHardMove() {
            const validMoves = getValidMoves(board);

            // 1. 即勝利チェック
            for (let move of validMoves) {
                board[move.r][move.c] = AI;
                const isWin = checkWin(board, AI);
                board[move.r][move.c] = EMPTY;
                if (isWin) return move;
            }

            // 2. 相手の即勝利を阻止
            for (let move of validMoves) {
                board[move.r][move.c] = PLAYER;
                const isEnemyWin = checkWin(board, PLAYER);
                board[move.r][move.c] = EMPTY;
                if (isEnemyWin) return move;
            }

            // 3. ミニマックス法で先読み (深さ: 2)
            const depth = 2;
            let bestScore = -Infinity;
            let bestMoves = [];

            // 盤面の中央に近いマスを最優先で並べ替え（枝刈り効率と展開を重視）
            const centerCol = (COLS - 1) / 2;
            const centerRow = (ROWS - 1) / 2;
            validMoves.sort((a, b) => {
                const distA = Math.abs(centerCol - a.c) + Math.abs(centerRow - a.r);
                const distB = Math.abs(centerCol - b.c) + Math.abs(centerRow - b.r);
                return distA - distB;
            });

            for (let move of validMoves) {
                board[move.r][move.c] = AI;
                let score = minimax(board, depth - 1, -Infinity, Infinity, false);
                board[move.r][move.c] = EMPTY;

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [move];
                } else if (score === bestScore) {
                    bestMoves.push(move);
                }
            }

            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        // ミニマックス再帰
        function minimax(tempBoard, depth, alpha, beta, isMaximizing) {
            const validMoves = getValidMoves(tempBoard);
            
            const aiWon = checkWin(tempBoard, AI);
            if (aiWon) return 10000 + depth;
            
            const playerWon = checkWin(tempBoard, PLAYER);
            if (playerWon) return -10000 - depth;

            if (validMoves.length === 0 || depth === 0) {
                return evaluatePosition(tempBoard, AI) - evaluatePosition(tempBoard, PLAYER);
            }

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of validMoves) {
                    tempBoard[move.r][move.c] = AI;
                    let evaluation = minimax(tempBoard, depth - 1, alpha, beta, false);
                    tempBoard[move.r][move.c] = EMPTY;
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of validMoves) {
                    tempBoard[move.r][move.c] = PLAYER;
                    let evaluation = minimax(tempBoard, depth - 1, alpha, beta, true);
                    tempBoard[move.r][move.c] = EMPTY;
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // 盤面全体の価値をスコア計算
        function evaluatePosition(tempBoard, player) {
            let score = 0;
            const opponent = (player === PLAYER) ? AI : PLAYER;

            // マス目ごとの中央近さボーナス（中央付近ほど色々なラインを作りやすい）
            const centerCol = (COLS - 1) / 2;
            const centerRow = (ROWS - 1) / 2;
            const maxDistance = centerCol + centerRow;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (tempBoard[r][c] === player) {
                        const distance = Math.abs(centerCol - c) + Math.abs(centerRow - r);
                        const bonus = maxDistance - distance;
                        score += Math.max(0, bonus);
                    }
                }
            }

            const winCount = winCondition; // 現在選択中の条件 (4, 5, 6)

            // Nマス並び窓（ウィンドウ）の評価
            function evaluateWindow(window) {
                let playerScore = 0;
                let opponentScore = 0;
                let emptyScore = 0;

                window.forEach(cell => {
                    if (cell === player) playerScore++;
                    else if (cell === opponent) opponentScore++;
                    else emptyScore++;
                });

                if (playerScore === winCount) return 10000;
                else if (playerScore === winCount - 1 && emptyScore === 1) return 100;  // あと1手で勝利
                else if (playerScore === winCount - 2 && emptyScore === 2) return 15;   // あと2手

                if (opponentScore === winCount - 1 && emptyScore === 1) return -250; // 相手のリーチをブロックすることを強力に評価

                return 0;
            }

            // 横
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let window = [];
                    for (let i = 0; i < winCount; i++) {
                        window.push(tempBoard[r][c+i]);
                    }
                    score += evaluateWindow(window);
                }
            }

            // 縦
            for (let r = 0; r <= ROWS - winCount; r++) {
                for (let c = 0; c < COLS; c++) {
                    let window = [];
                    for (let i = 0; i < winCount; i++) {
                        window.push(tempBoard[r+i][c]);
                    }
                    score += evaluateWindow(window);
                }
            }

            // 右下斜め
            for (let r = 0; r <= ROWS - winCount; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let window = [];
                    for (let i = 0; i < winCount; i++) {
                        window.push(tempBoard[r+i][c+i]);
                    }
                    score += evaluateWindow(window);
                }
            }

            // 左下斜め
            for (let r = winCount - 1; r < ROWS; r++) {
                for (let c = 0; c <= COLS - winCount; c++) {
                    let window = [];
                    for (let i = 0; i < winCount; i++) {
                        window.push(tempBoard[r-i][c+i]);
                    }
                    score += evaluateWindow(window);
                }
            }

            return score;
        }

        // 初期ロード実行
        window.onload = function() {
            init();
        };
    </script>
